name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/vibrant-albattani-vf1wy8]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; never cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement:true switches Pages on if it is currently off,
      # so the repository needs no manual setup first
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # publish only what the site serves — FACTS.md is a working document
      # and stays out of the deployed folder
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
