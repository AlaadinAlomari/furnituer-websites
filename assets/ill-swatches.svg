<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Illustration of fabric swatches and wood samples">
<rect width="1200" height="800" fill="#ece5dc"/>
<g stroke="#2a2724" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".6">
  <!-- table edge -->
  <path d="M60 660h1080"/>
  <!-- fanned fabric swatches -->
  <g transform="rotate(-16 420 420)"><rect x="200" y="300" width="230" height="300" rx="10" fill="#e6dbcd"/></g>
  <g transform="rotate(-6 460 420)"><rect x="270" y="300" width="230" height="300" rx="10" fill="#e1d5c5"/></g>
  <g transform="rotate(5 520 420)"><rect x="340" y="300" width="230" height="300" rx="10" fill="#dccfbd"/></g>
  <!-- weave texture on the top swatch -->
  <g opacity=".45" transform="rotate(5 520 420)">
    <path d="M370 340v220M410 330v230M450 325v235M490 330v230M530 340v220"/>
    <path d="M345 380h220M345 430h220M345 480h220M345 530h220"/>
  </g>
  <!-- wood samples -->
  <rect x="700" y="420" width="130" height="180" rx="8" fill="#e3d6c4"/>
  <rect x="850" y="420" width="130" height="180" rx="8" fill="#d8c8b2"/>
  <rect x="1000" y="420" width="130" height="180" rx="8" fill="#cbb89f"/>
  <path d="M726 440v140M766 440v140M806 440v140" opacity=".4"/>
  <path d="M876 440v140M916 440v140M956 440v140" opacity=".4"/>
  <path d="M1026 440v140M1066 440v140M1106 440v140" opacity=".4"/>
  <!-- hand lifting a corner -->
  <path d="M560 300c40-18 78-10 100 16 14 16 16 36 8 52"/>
  <path d="M660 368c18-14 40-12 52 4M646 392c20-16 44-14 58 4M634 418c20-14 42-12 56 4"/>
</g>
<g fill="#f04a7c" opacity=".85"><g transform="rotate(5 520 420)"><rect x="340" y="300" width="230" height="46" rx="10"/></g></g>
</svg>
